[workspace]
resolver = "3"
members = ["crates/crc-config", "crates/crc-core", "crates/crc-editor", "crates/crc-text", "crates/crc-syntax", "crates/crc-theme", "crates/crc-app", "crates/crc-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cringecraft/crc-code"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
